spring:
  config:
    import: env_local.yml
---

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: kakao
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            #            redirect-uri: ${KAKAO_REDIRECT_URL}
            #            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: ${KAKAO_AUTH_URL}
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

---

jwt:
  header: Authorization
  secret: ${JWT_SECRET_KEY}
  access-token-expire: ${ACCESS_TOKEN_EXPIRE}
  refresh-token-expire: ${REFRESH_TOKEN_EXPIRE}
  share-token-expire: ${SHARE_TOKEN_EXPIRE}

---

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${MARIA_URL}
    username: ${MARIA_USERNAME}
    password: ${MARIA_PASSWORD}
    hikari:
      maximum-pool-size: 148
      max-lifetime: 60000
  data:
    mongodb:
      host: ${MONGO_HOST}
      port: ${MONGO_PORT}
      uri: ${MONGODB_URI}
      authentication-database: admin
      username: ${MONGO_DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}
      database: ${MONGO_DATABASE_NAME}

---

spring:
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl # ?? camelCase-> underscore ?? ??.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show_sql: true              # sql 보기 옵션
        format_sql: true            # 예쁘게 포맷팅
        highlight_sql: true         # ANSI 코드에 색을 나타낸다
        use_sql_comments: true      # jpql 실행문 볼수있음
        dialect: org.hibernate.dialect.MariaDBDialect
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: 100
    open-in-view: false
    defer-datasource-initialization: true

---
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

---

spring:
  main:
    allow-bean-definition-overriding: true

---
server:
  port: ${SPRING_SERVER_PORT}
  
  
---
## 더미데이터 테스트
spring:
  sql:
    init:
      mode: always

---
### monitoring
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT}
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus

---
logging:
  level:
    com:
      galaxy:
        novelit: info



